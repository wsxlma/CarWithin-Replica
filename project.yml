name: CarWithinReplica

options:
  bundleIdPrefix: local.carwithin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.3.1"
    CURRENT_PROJECT_VERSION: "33"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  CarWithinReplica:
    type: application
    platform: iOS
    sources:
      - path: CarWithinReplica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carwithin.replica
        PRODUCT_NAME: CarWithin
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: CarWithinReplica/Info.plist
      properties:
        CFBundleDisplayName: CarWithin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: CarWithin 需要访问本地网络，以接收 CarPlay 音视频，并在你选择时把画面或声音发送给局域网接收设备。
        NSBonjourServices:
          - _airplay._tcp
          - _airplay._tcp.
          - _tds-carkit._tcp
          - _tds-carkit._tcp.
          - _carplay-ctrl._tcp
          - _carplay-ctrl._tcp.
          - _carwithin._tcp
          - _carwithin._tcp.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBluetoothAlwaysUsageDescription: CarWithin 需要使用蓝牙来发现并连接 CarPlay 设备。
        NSMicrophoneUsageDescription: CarWithin 需要使用麦克风，将 Siri 和通话语音传回 iPhone。
        NSLocationWhenInUseUsageDescription: CarWithin 仅使用定位权限读取当前 Wi-Fi 名称，不会收集位置坐标。
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
