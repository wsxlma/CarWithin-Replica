name: Build unsigned IPA

permissions:
  contents: write

on:
  # 只跑分支，不再响应 tag：发布统一由 upstream.yml 负责，避免旧实现把包抢先进 release。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CarWithinReplica.xcodeproj \
            -scheme CarWithinReplica \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CarWithin.app"
          test -d "$APP" || { echo "找不到 $APP"; ls -R build/Build/Products || true; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          cd out
          zip -qry CarWithinReplica-unsigned.ipa Payload
          shasum -a 256 CarWithinReplica-unsigned.ipa | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: CarWithinReplica-unsigned-ipa
          path: |
            out/CarWithinReplica-unsigned.ipa
            out/SHA256SUMS
          if-no-files-found: error

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CarWithinReplica-unsigned.ipa
            out/SHA256SUMS
          generate_release_notes: true
